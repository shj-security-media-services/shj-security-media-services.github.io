# الفحص البصري بعد كل نشر: صور / و /get/ على آيفون وأندرويد، فاتح وداكن، عربي وإنجليزي، تُقارن بصور المرجع (فرع visual-baseline).
# عند تغيّر الشكل: بلاغ «🎨 تغيّر في شكل الصفحات» بالصور قبل/بعد/الفرق ويفشل الفحص. لاعتماد الشكل الجديد: Run workflow مع accept.
# Visual check after every deploy: / and /get/ on iPhone and Android, light and dark, Arabic and English, against the baselines on the
# visual-baseline branch; a change opens an issue with before/after/diff and fails the run. axe-core per screen (warning only).
# SAFETY: every request outside the site (the sign-in API above all) is aborted; nothing is typed or pressed.
name: Visual

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      accept:
        description: 'اعتماد الشكل الحالي مرجعاً جديداً · Accept the current look as the new baseline'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual
  cancel-in-progress: false

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the visual-baseline and status branches
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SITE: https://shj-security-media-services.github.io
    steps:
      - name: Folders
        run: |
          echo "VIS=$RUNNER_TEMP/vis" >> "$GITHUB_ENV"
          echo "VB=$RUNNER_TEMP/visual-baseline" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/tools/package-lock.json
      - name: Install the tools
        working-directory: .github/tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          # Arabic glyphs: the pages use the system font
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-core >/dev/null
      - name: Wait for the deploy
        if: github.event_name == 'push'
        run: bash .github/scripts/wait-deploy.sh
      - name: Open the baselines
        run: bash .github/scripts/branch.sh open visual-baseline "$VB"
      - name: Screenshots, comparison and axe
        run: |
          mkdir -p "$VIS"
          SHOTS="$VIS/shots" BASELINE="$VB/current" DIFFS="$VIS/diffs" RESULT="$VIS/result.json" SUMMARY="$VIS/summary.md" \
            node .github/tools/visual.mjs
          cat "$VIS/summary.md" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.rules[] | select(.impact == "critical" or .impact == "serious") | "::warning title=axe \(.impact)::\(.id) on \(.screens) screens: \(.help)"' "$VIS/result.json"
      - name: Baselines and the change issue
        env:
          ACCEPT: ${{ github.event_name == 'workflow_dispatch' && inputs.accept }}
        run: bash .github/scripts/visual-act.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: visual
          path: ${{ runner.temp }}/vis
          retention-days: 30
          if-no-files-found: ignore
      - name: Save the result
        if: always()
        run: |
          [ -f "$VIS/result.json" ] || exit 0
          bash .github/scripts/branch.sh open status "$RUNNER_TEMP/status"
          jq --arg outcome "$(cat "$VIS/outcome" 2>/dev/null || echo failed)" --arg commit "$GITHUB_SHA" \
             --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
             '{at, commit: $commit, run: $run, outcome: $outcome, total, same, changed, new, flaky, axe, rules: [.rules[] | {id, impact, screens}], blocked}' \
             "$VIS/result.json" > "$RUNNER_TEMP/status/visual.json"
          bash .github/scripts/branch.sh push "$RUNNER_TEMP/status" "visual: ${GITHUB_SHA::7}"
