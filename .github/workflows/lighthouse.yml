# Lighthouse على الجوال لصفحتي / و /get/ بعد كل نشر: 4 درجات لكل صفحة في الملخص، والتقارير كملف مرفق. لا يفشل بسبب الدرجات.
# Lighthouse (mobile) on / and /get/ after every deploy: 4 scores per page in the summary, reports as an artifact. Never fails on scores.
name: Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # the status branch
    env:
      GH_TOKEN: ${{ github.token }}
      SITE: https://shj-security-media-services.github.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Wait for the deploy
        if: github.event_name == 'push'
        run: bash .github/scripts/wait-deploy.sh
      - name: Lighthouse
        run: OUT="$RUNNER_TEMP/lh" node .github/scripts/lighthouse.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: ${{ runner.temp }}/lh
          retention-days: 30
      - name: Save the scores
        run: |
          bash .github/scripts/branch.sh open status "$RUNNER_TEMP/status"
          cp "$RUNNER_TEMP/lh/lighthouse.json" "$RUNNER_TEMP/status/lighthouse.json"
          bash .github/scripts/branch.sh push "$RUNNER_TEMP/status" "lighthouse: ${GITHUB_SHA::7}"
