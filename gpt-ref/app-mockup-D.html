<title>نماذج تطبيق الإعلام الأمني</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a phone app for field crews. A brown "command" header with a guilloche band sits over cream paper; one column of
   cards; a bottom tab bar. The demo stage around the phone holds the role switch and the notes. */
:root{
  /* paper and ink */
  --bg:#f6f3ef; --surface:#ffffff; --surface-2:#faf7f3; --surface-3:#efe9e2;
  --ink:#2b241e; --ink-2:#574a3e; --muted:#6f6054; --line:#e9e1d7; --line-2:#d9cec1; --field:#948473;
  /* brand, from the emblem's wreath */
  --brand:#7d6a57; --brand-fill:#5e4e3e; --brand-press:#4d4033; --brand-ink:#574839; --brand-tint:#f1ebe3; --brand-tint-2:#e6dccf; --on-brand:#ffffff;
  --head:#7d6a57; --head-2:#6b5a48; --on-head:#ffffff; --on-head-2:#ffffff; --head-chip:rgb(20 14 8 / .22);
  --seal:#fffdf9; --icon-bg:#7d6a57;
  /* status (never colour alone: every status also has an icon and a word) */
  --ok:#2f6a2c; --ok-bg:#e7f1e3; --ok-fill:#2f6a2c;
  --warn:#8a5a00; --warn-bg:#fbf0d9;
  --bad:#a3322f; --bad-bg:#fbe9e7; --bad-fill:#a3322f;
  --info:#2b5c8a; --info-bg:#e6eff8;
  --neu:#5f5a52; --neu-bg:#efece6;
  --rec:#c8312b; --rec-bg:#fbe9e7; --on-rec:#ffffff;
  --focus:#2b5c8a;
  --toast:#2b241e; --on-toast:#f6f3ef;
  --scrim:rgb(20 16 12 / .46);
  --shadow-1:0 1px 2px rgb(43 36 30 / .06), 0 2px 8px -2px rgb(43 36 30 / .08);
  --shadow-2:0 2px 6px rgb(43 36 30 / .08), 0 16px 36px -10px rgb(43 36 30 / .28);
  /* avatars */
  --av1:#e6dccf; --av1-ink:#574839; --av2:#dfe8d9; --av2-ink:#2f5a2c; --av3:#dde6ef; --av3-ink:#2b4f73; --av4:#f1e1d3; --av4-ink:#7a4520;
  /* demo stage (outside the phone) */
  --stage:#e9e3db; --stage-ink:#2b241e; --panel:#fbf9f6; --bezel:#151413; --bezel-edge:#3a3836;
  /* type */
  --f-body:"IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --f-display:"Noto Kufi Arabic", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  /* shape */
  --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:28px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14110e; --surface:#1d1915; --surface-2:#231e19; --surface-3:#2c261f;
    --ink:#f2ebe3; --ink-2:#d2c5b6; --muted:#a69584; --line:#332c25; --line-2:#43392f; --field:#7a6a5a;
    --brand:#c2a98d; --brand-fill:#c9b196; --brand-press:#d8c3aa; --brand-ink:#e0cdb6; --brand-tint:#2a231c; --brand-tint-2:#3a3027; --on-brand:#1a140f;
    --head:#2a221b; --head-2:#211b15; --on-head:#ffffff; --on-head-2:#ffffff; --head-chip:rgb(255 255 255 / .12);
    --seal:#f6f1ea;
    --ok:#8fd18a; --ok-bg:#1e2e1c; --ok-fill:#3f7d3a;
    --warn:#f0c062; --warn-bg:#33280f;
    --bad:#ff9a90; --bad-bg:#3a1c1a; --bad-fill:#b23b36;
    --info:#8cbcf0; --info-bg:#182637;
    --neu:#c4bcb0; --neu-bg:#2a2622;
    --rec:#ff6a5e; --rec-bg:#3a1c1a; --on-rec:#1a140f;
    --focus:#8cbcf0;
    --toast:#f2ebe3; --on-toast:#1d1915;
    --scrim:rgb(0 0 0 / .6);
    --shadow-1:0 1px 2px rgb(0 0 0 / .4);
    --shadow-2:0 2px 6px rgb(0 0 0 / .4), 0 18px 40px -10px rgb(0 0 0 / .7);
    --av1:#3a3027; --av1-ink:#e0cdb6; --av2:#22331f; --av2-ink:#a9d8a3; --av3:#1d2c3d; --av3-ink:#a9c9ec; --av4:#3a2819; --av4-ink:#f0c49c;
    --stage:#0f0d0b; --stage-ink:#f2ebe3; --panel:#1a1613; --bezel:#050505; --bezel-edge:#2a2826;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14110e; --surface:#1d1915; --surface-2:#231e19; --surface-3:#2c261f;
  --ink:#f2ebe3; --ink-2:#d2c5b6; --muted:#a69584; --line:#332c25; --line-2:#43392f; --field:#7a6a5a;
  --brand:#c2a98d; --brand-fill:#c9b196; --brand-press:#d8c3aa; --brand-ink:#e0cdb6; --brand-tint:#2a231c; --brand-tint-2:#3a3027; --on-brand:#1a140f;
  --head:#2a221b; --head-2:#211b15; --on-head:#ffffff; --on-head-2:#ffffff; --head-chip:rgb(255 255 255 / .12);
  --seal:#f6f1ea;
  --ok:#8fd18a; --ok-bg:#1e2e1c; --ok-fill:#3f7d3a;
  --warn:#f0c062; --warn-bg:#33280f;
  --bad:#ff9a90; --bad-bg:#3a1c1a; --bad-fill:#b23b36;
  --info:#8cbcf0; --info-bg:#182637;
  --neu:#c4bcb0; --neu-bg:#2a2622;
  --rec:#ff6a5e; --rec-bg:#3a1c1a; --on-rec:#1a140f;
  --focus:#8cbcf0;
  --toast:#f2ebe3; --on-toast:#1d1915;
  --scrim:rgb(0 0 0 / .6);
  --shadow-1:0 1px 2px rgb(0 0 0 / .4);
  --shadow-2:0 2px 6px rgb(0 0 0 / .4), 0 18px 40px -10px rgb(0 0 0 / .7);
  --av1:#3a3027; --av1-ink:#e0cdb6; --av2:#22331f; --av2-ink:#a9d8a3; --av3:#1d2c3d; --av3-ink:#a9c9ec; --av4:#3a2819; --av4-ink:#f0c49c;
  --stage:#0f0d0b; --stage-ink:#f2ebe3; --panel:#1a1613; --bezel:#050505; --bezel-edge:#2a2826;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--stage);color:var(--stage-ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
bdi.ref,.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- icons ---------- */
.i{width:1.375em;height:1.375em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.i.s{width:1.15em;height:1.15em}
.i.xs{width:1em;height:1em;stroke-width:2}
.i.l{width:1.75em;height:1.75em}
[dir="rtl"] .i.dir{transform:scaleX(-1)}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:minmax(270px,320px) auto minmax(260px,330px);gap:28px;justify-content:center;align-items:start;padding:24px 24px 40px;min-height:100vh}
.demo,.notes{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;scrollbar-width:thin}
.demo h1{font:700 18px/1.3 var(--f-display);margin:0 0 2px;color:var(--ink);text-wrap:balance}
.demo .lede{color:var(--muted);font-size:13px;margin:0 0 14px}
.dg{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.dg h2{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:0 0 8px}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.dchip[aria-pressed="true"]{background:var(--brand-fill);border-color:var(--brand-fill);color:var(--on-brand)}
.dchip.sm{min-height:30px;font-size:12px;padding:0 10px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.key{display:flex;align-items:center;gap:6px;min-height:34px;padding:4px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink-2);text-align:start}
.key .bx{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--field);display:grid;place-items:center;flex:none}
.key[aria-pressed="true"]{color:var(--ink);border-color:var(--brand-tint-2);background:var(--brand-tint)}
.key[aria-pressed="true"] .bx{background:var(--brand-fill);border-color:var(--brand-fill);color:var(--on-brand)}
.key code{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-inline-start:auto}
.dnote{font-size:12px;color:var(--muted);margin:8px 0 0}
.dnote b{color:var(--ink)}
.dlist{display:grid;gap:4px}
.dlink{display:flex;align-items:center;gap:8px;min-height:34px;padding:4px 10px;border-radius:10px;border:0;background:transparent;text-align:start;font-size:13px;color:var(--ink)}
.dlink:hover{background:var(--surface-3)}
.dlink[aria-current="true"]{background:var(--brand-tint);color:var(--brand-ink);font-weight:700}
.dlink small{color:var(--muted);margin-inline-start:auto;font-size:11px}
.pushk{display:flex;align-items:center;gap:8px;width:100%;min-height:38px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;text-align:start;color:var(--ink)}
.pushk+.pushk{margin-top:6px}
.pushk small{margin-inline-start:auto;color:var(--muted);font-family:var(--f-mono);font-size:10.5px;direction:ltr}
.homeic{display:flex;align-items:center;gap:12px;margin-top:10px}
.homeic .hi{position:relative;display:grid;justify-items:center;gap:4px;flex:none}
.homeic .hi small{font-size:11px;color:var(--ink);max-width:76px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.homeic .hi .bdg{position:absolute;top:-6px;inset-inline-end:-6px;min-width:22px;height:22px;border-radius:11px;background:#c8312b;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px;border:2px solid var(--panel)}
.notes h2{font:700 16px/1.35 var(--f-display);margin:0 0 6px;color:var(--ink)}
.notes h3{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:14px 0 4px}
.notes p,.notes li{font-size:13px;color:var(--ink-2);margin:0}
.notes ul{margin:0;padding-inline-start:18px;display:grid;gap:3px}
.notes code{font-family:var(--f-mono);font-size:11.5px;background:var(--surface-3);padding:1px 5px;border-radius:5px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* ---------- device ---------- */
.devcol{display:flex;justify-content:center}
.devwrap{transform-origin:top center}
.device{position:relative;width:414px;height:868px;padding:12px;border-radius:66px;background:var(--bezel);box-shadow:inset 0 0 0 2px var(--bezel-edge),0 40px 80px -24px rgb(0 0 0 / .45)}
.device.android{border-radius:46px}
.screen{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;isolation:isolate;--sat:47px;--sab:30px;--tabh:calc(64px + var(--sab));background:var(--bg)}
.device.android .screen{border-radius:36px;--sat:34px;--sab:18px}
.island{position:absolute;top:11px;left:50%;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000;z-index:90;pointer-events:none}
.device.android .island{top:12px;width:14px;height:14px;margin-left:-7px;border-radius:50%}
.sbar{position:absolute;inset-inline:0;top:0;height:var(--sat);z-index:89;display:flex;align-items:center;justify-content:space-between;padding:4px 34px 0;color:#fff;font:600 15px/1 var(--f-body);pointer-events:none;direction:ltr}
.device.android .sbar{padding:2px 20px 0;font-size:13px}
.sbar .sicons{display:flex;gap:6px;align-items:center}
.sbar.onlight{color:var(--ink)}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.85;z-index:95;pointer-events:none}
.device.android .homebar{width:108px;margin-left:-54px;height:4px;bottom:6px}

/* ---------- app ---------- */
.app{position:absolute;inset:0;font-size:calc(16px * var(--fs,1));line-height:1.6;color:var(--ink);background:var(--bg);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overflow:hidden}
.views{position:absolute;inset:0}
.app.tabs .views{bottom:var(--tabh)}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}
.pad-b{height:28px}
.view.in-push{animation:inPush .34s var(--ease) both}
.view.out-push{animation:outPush .34s var(--ease) both}
.view.in-pop{animation:inPop .34s var(--ease) both}
.view.out-pop{animation:outPop .34s var(--ease) both}
.view.in-fade{animation:inFade .18s ease-out both}
@keyframes inPush{from{transform:translateX(calc(var(--dirx) * 100%))}to{transform:none}}
@keyframes outPush{from{transform:none}to{transform:translateX(calc(var(--dirx) * -28%));filter:brightness(.92)}}
@keyframes inPop{from{transform:translateX(calc(var(--dirx) * -28%));filter:brightness(.92)}to{transform:none}}
@keyframes outPop{from{transform:none}to{transform:translateX(calc(var(--dirx) * 100%))}}
@keyframes inFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view.out-pop,.view.in-push{z-index:2;box-shadow:0 0 40px rgb(0 0 0 / .18)}
[dir="ltr"] .app{--dirx:1} [dir="rtl"] .app{--dirx:-1}

/* header: compact bar */
.bar{flex:none;position:relative;z-index:5;color:var(--on-head);background:var(--head);background-image:linear-gradient(180deg,var(--head),var(--head-2));padding-top:var(--sat)}
.bar-in{height:56px;display:flex;align-items:center;gap:2px;padding-inline:6px}
.bar h1{flex:1;min-width:0;margin:0;text-align:center;font:700 1.0625em/1.25 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{display:block;font:500 .7em/1.3 var(--f-mono);color:var(--on-head-2);letter-spacing:.02em}
.ibtn{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:0;background:transparent;color:inherit;flex:none}
.ibtn:active{background:rgb(255 255 255 / .16)}
.dotb{position:absolute;top:9px;inset-inline-end:9px;width:10px;height:10px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 2px var(--head)}
.ibtn .bdg{position:absolute;top:5px;inset-inline-end:4px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;background:var(--rec);color:var(--on-rec);font:700 11px/18px var(--f-body);text-align:center;box-shadow:0 0 0 2px var(--head)}
.bar .sp{width:44px;flex:none}

/* header: hero (scrolls with the content) */
.hero{color:var(--on-head);background:var(--head);background-image:linear-gradient(180deg,var(--head) 0%,var(--head-2) 100%);padding:calc(var(--sat) + 4px) 16px 44px;position:relative}
/* the guilloche lives only in the bottom band, behind the card overlap, never behind text (UX critique 9) */
.hero::before,.onb-top::before{content:"";position:absolute;inset-inline:0;bottom:0;height:40px;background:var(--guil) center bottom/520px auto no-repeat;-webkit-mask-image:linear-gradient(to top,#000 55%,transparent);mask-image:linear-gradient(to top,#000 55%,transparent);pointer-events:none}
.onb-top::before{height:22px}
.hero-top{display:flex;align-items:center;gap:10px;min-height:44px}
.seal{width:42px;height:42px;border-radius:50%;background:var(--seal);display:grid;place-items:center;padding:4px;flex:none;box-shadow:0 0 0 1px rgb(255 255 255 / .35),0 2px 6px rgb(0 0 0 / .18)}
.seal img{width:100%;height:100%;object-fit:contain;display:block}
.wordmark{flex:1;min-width:0;line-height:1.25}
.wordmark b{display:block;font:700 .9375em var(--f-display)}
.wordmark small{display:block;font-size:.75em;color:var(--on-head-2)}
.hello{font:700 1.375em/1.3 var(--f-display);margin:10px 0 0;text-wrap:balance}
.hello:focus,h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus{outline:none}
.hdate{color:var(--on-head-2);font-size:.875em}
.hchips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hchip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:2px 12px;border-radius:999px;background:var(--head-chip);font-size:.8125em;font-weight:600;color:var(--on-head)}
.hchip .dot{width:8px;height:8px;border-radius:50%;background:#9be29a}
.minibar{position:absolute;inset-inline:0;top:0;z-index:6;color:var(--on-head);background:var(--head);background-image:linear-gradient(180deg,var(--head),var(--head-2));padding-top:var(--sat);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .18s,transform .18s}
.minibar.on{opacity:1;transform:none;pointer-events:auto}
.minibar .mt{flex:1;min-width:0;text-align:center;font:700 1.0625em/1.25 var(--f-display)}
.lift{margin-top:-30px;padding-inline:16px;position:relative;z-index:2}

/* pull to refresh */
.ptr{position:absolute;inset-inline:0;top:calc(var(--sat) + 4px);display:flex;justify-content:center;z-index:7;pointer-events:none;opacity:0;transform:translateY(-20px)}
.ptr .ring{width:34px;height:34px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-2);display:grid;place-items:center;color:var(--brand-ink)}
.ptr.spin .ring .i{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* sections */
.sec{padding:22px 16px 0}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 2px 10px}
.sec-h h2{margin:0;font:700 1em/1.3 var(--f-display);color:var(--ink)}
.sec-h .cnt{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--surface-3);color:var(--ink-2);font-size:.75em;font-weight:700;display:inline-grid;place-items:center}
.sec-h .cnt.hot{background:var(--warn-bg);color:var(--warn)}
.sec-h .cnt.bad{background:var(--bad-bg);color:var(--bad)}
.sec-h .more{margin-inline-start:auto;border:0;background:none;color:var(--brand-ink);font-weight:600;font-size:.875em;min-height:44px;padding:0 4px;display:inline-flex;align-items:center;gap:2px}
.stack{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l)}
.updated{color:var(--muted);font-size:.8125em;text-align:center;padding:22px 16px 0;display:flex;justify-content:center;align-items:center;gap:6px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:1px 10px;border-radius:999px;font-size:.78125em;font-weight:700;white-space:nowrap;background:var(--neu-bg);color:var(--neu);line-height:1.3}
.chip[data-k="ok"]{background:var(--ok-bg);color:var(--ok)}
.chip[data-k="warn"]{background:var(--warn-bg);color:var(--warn)}
.chip[data-k="bad"]{background:var(--bad-bg);color:var(--bad)}
.chip[data-k="info"]{background:var(--info-bg);color:var(--info)}
.chip[data-k="rec"]{background:var(--rec-bg);color:var(--rec)}
.chip[data-k="brand"]{background:var(--brand-tint);color:var(--brand-ink)}
.chip[data-k="line"]{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.chip .recdot{width:8px;height:8px;border-radius:50%;background:currentColor}
/* REC blinks only in the focal card, and stops after 5 blinks (UX critique 18) */
.next .chip .recdot,.next .steps li.rec .nd{animation:rec 1.2s ease-in-out 5}
@keyframes rec{50%{opacity:.25}}
.chip.pend{background:var(--surface-3);color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1.5px solid transparent;background:var(--surface-3);color:var(--ink);font-weight:600;font-size:1em;line-height:1.2;transition:transform .12s var(--ease),background-color .15s,opacity .15s;text-align:center;white-space:nowrap}
.btn:active{transform:scale(.975)}
.btn.primary{background:var(--brand-fill);color:var(--on-brand)}
.btn.primary:active{background:var(--brand-press)}
.btn.tonal{background:var(--surface-3);color:var(--ink)}
.btn.ghost{background:transparent;border-color:var(--field);color:var(--ink)}
.btn.demo-only{background:transparent;border:1.5px dashed var(--field);color:var(--ink-2);font-size:.875em}
.btn.okf{background:var(--ok-fill);color:#fff}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.dangerf{background:var(--bad-fill);color:#fff}
.btn.xl{min-height:56px;border-radius:16px;font-size:1.0625em;padding:0 20px}
.btn.sm{min-height:44px;padding:0 14px;font-size:.9375em;border-radius:12px}
.btn.block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn .spn{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-inline-end-color:transparent;animation:spin .7s linear infinite}
.btns{display:flex;gap:10px}
.btns>.btn{flex:1}
.btn.sq{width:56px;padding:0;flex:none}

/* the next task (focal card) */
.next{background:var(--surface);border-radius:24px;box-shadow:var(--shadow-2);padding:16px 16px 14px;border:1px solid var(--line)}
.next-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{font-size:.8125em;font-weight:700;letter-spacing:.04em;color:var(--ink-2);margin-inline-end:auto}
.countdown{font-size:.8125em;font-weight:700;color:var(--ink);background:var(--surface-3);border-radius:999px;padding:2px 10px}
.next-when{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.bigtime{font:700 2.25em/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink)}
.bigtime small{font-size:.42em;font-weight:600;color:var(--muted);margin-inline-start:4px}
.next-when .to{color:var(--muted);font-size:.9375em;font-variant-numeric:tabular-nums}
.next h2{font:700 1.125em/1.4 var(--f-display);margin:8px 0 10px;text-wrap:balance}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.facts li{display:flex;gap:10px;align-items:flex-start;font-size:.9375em;color:var(--ink-2);min-width:0}
.facts li .i{color:var(--muted);margin-top:2px}
.facts li .tx{flex:1;min-width:0}
.facts li b{color:var(--ink);font-weight:600}
.facts a,.lnk{color:var(--brand-ink);font-weight:700;text-decoration:none;border:0;background:none;padding:0;font-size:inherit}
.next .btns{margin-top:14px}
.next .btns .btn.ghost:not(.sq){flex:0 0 auto}
.placerow{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;margin:0 0 10px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);text-decoration:none}
.placerow .tx{flex:1;min-width:0}
.placerow .tx b{display:block;font-weight:600;line-height:1.35}
.placerow .tx small{display:block;color:var(--brand-ink);font-weight:700;font-size:.8125em}
.placerow>.i{color:var(--muted)}
.wstrip{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 14px;border-radius:16px;border:1.5px solid var(--warn);background:var(--warn-bg);color:var(--ink);font-weight:600;font-size:.875em;text-align:start;box-shadow:var(--shadow-1)}
.wstrip>.i{color:var(--warn)}
.wstrip .grow{flex:1;min-width:0}
.obx{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--bad);box-shadow:var(--shadow-1)}
.obx[data-k="warn"]{border-color:var(--warn)}
.obx>.i{color:var(--bad);margin-top:2px}
.obx[data-k="warn"]>.i{color:var(--warn)}
.obx .tx b{display:block;line-height:1.4}
.obx .tx small{display:block;color:var(--ink-2);font-size:.8125em;line-height:1.45}
.obx .btns{margin-top:8px;justify-content:flex-end}
.obx .btns .btn{flex:0 1 auto}

/* stepper */
.steps{list-style:none;margin:16px 0 4px;padding:0;display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.steps li{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:.75em;font-weight:600;color:var(--muted);text-align:center;line-height:1.25}
.steps li::before{content:"";position:absolute;top:13px;inset-inline-end:50%;width:100%;height:3px;background:var(--line-2);z-index:0;border-radius:2px}
.steps li:first-child::before{display:none}
.steps li.done::before,.steps li.now::before{background:var(--brand)}
.steps .nd{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 2px var(--field);color:var(--muted)}
.steps li.done .nd{background:var(--brand-fill);box-shadow:none;color:var(--on-brand)}
.steps li.now .nd{box-shadow:inset 0 0 0 2.5px var(--brand);color:var(--brand-ink)}
.steps li.now .nd::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--brand);opacity:0;animation:pulse 1.8s ease-out 3}
.steps li.skip .nd{box-shadow:inset 0 0 0 2px var(--field);background:var(--surface-2)}
.steps li.done,.steps li.now{color:var(--ink)}
.steps li.rec .nd{box-shadow:inset 0 0 0 2.5px var(--rec);color:var(--rec)}
.steps li.rec .nd::after{border-color:var(--rec)}
@keyframes pulse{0%{transform:scale(.85);opacity:.5}100%{transform:scale(1.35);opacity:0}}

/* task timeline (day list) */
.tl{display:grid;gap:0}
.tl-row{display:grid;grid-template-columns:64px 18px 1fr;gap:0 10px;align-items:stretch;border:0;background:none;padding:0;text-align:start;width:100%;position:relative}
.tl-time{padding-top:14px;text-align:end;font-variant-numeric:tabular-nums}
.tl-time b{display:block;font:700 1em/1.2 var(--f-display)}
.tl-time small{display:block;color:var(--muted);font-size:.75em}
.tl-rail{position:relative;display:flex;justify-content:center}
.tl-rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line-2)}
.tl-row:first-child .tl-rail::before{top:20px}
.tl-row:last-child .tl-rail::before{bottom:calc(100% - 22px)}
.tl-dot{position:relative;margin-top:17px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 3px var(--line-2)}
.tl-dot[data-k="ok"]{box-shadow:inset 0 0 0 7px var(--ok)}
.tl-dot[data-k="info"]{box-shadow:inset 0 0 0 7px var(--info)}
.tl-dot[data-k="warn"]{box-shadow:inset 0 0 0 3px var(--warn)}
.tl-dot[data-k="rec"]{box-shadow:inset 0 0 0 7px var(--rec)}
.tl-dot[data-k="bad"]{box-shadow:inset 0 0 0 3px var(--bad)}
.tl-dot[data-k="neu"]{box-shadow:inset 0 0 0 3px var(--neu)}
.tl-card{margin:6px 0;padding:12px 14px;min-width:0}
.tl-card.is-next{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}

/* generic task / order card */
.tcard{display:block;width:100%;text-align:start;padding:14px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line);color:inherit;position:relative}
/* one link per card: the title, stretched over the card; inner buttons sit above it (UX critique 17) */
.stretch{all:unset;cursor:pointer;color:inherit;font:inherit;display:inline;-webkit-tap-highlight-color:transparent}
.stretch::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:0}
.stretch:focus-visible::after{outline:3px solid var(--focus);outline-offset:-3px;border-radius:var(--r-l)}
.tcard .btns,.tcard .btn,.tcard .lnk,.tcard .t-top,.brow .slots{position:relative;z-index:1}
.tcard .t-top{pointer-events:none}
h3.t-title{font-size:1em}
.tcard:active{background:var(--surface-2)}
.t-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.t-top .ref{margin-inline-start:auto;color:var(--muted);font-size:.75em}
.t-title{font-weight:700;font-size:1em;line-height:1.45;margin:6px 0 4px;color:var(--ink)}
.t-meta{display:flex;gap:6px;align-items:flex-start;color:var(--ink-2);font-size:.875em;line-height:1.5;margin-top:2px;min-width:0}
.t-meta .i{color:var(--muted);margin-top:1px}
.t-meta span{min-width:0}
.t-foot{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.t-foot .grow{flex:1}
.spec{display:inline-flex;align-items:center;gap:4px;font-size:.75em;font-weight:700;color:var(--ink-2);background:var(--surface-3);border-radius:8px;padding:2px 8px}
.when{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.875em;color:var(--ink)}
.overdue{color:var(--bad);font-weight:700;font-size:.8125em;display:inline-flex;gap:4px;align-items:center}
.reply .btns{margin-top:12px}

/* avatars */
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font:700 .8125em/1 var(--f-display);background:var(--av1);color:var(--av1-ink);flex:none;position:relative}
.av.c2{background:var(--av2);color:var(--av2-ink)} .av.c3{background:var(--av3);color:var(--av3-ink)} .av.c4{background:var(--av4);color:var(--av4-ink)}
.av.lg{width:64px;height:64px;font-size:1.375em}
.av.md{width:40px;height:40px;font-size:.9375em}
.av .st{position:absolute;bottom:-2px;inset-inline-end:-2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);background:var(--neu)}
.av .st[data-k="ok"]{background:var(--ok)} .av .st[data-k="info"]{background:var(--info)} .av .st[data-k="warn"]{background:var(--warn)} .av .st[data-k="bad"]{background:var(--bad)} .av .st[data-k="rec"]{background:var(--rec)}
.avs{display:inline-flex}
.avs .av{box-shadow:0 0 0 2px var(--surface)}
.avs .av+.av{margin-inline-start:-8px}

/* lists and rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:0;background:none;width:100%;text-align:start;color:inherit;position:relative}
.row+.row{border-top:1px solid var(--line)}
button.row:active,a.row:active{background:var(--surface-2)}
.row .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2);flex:none}
.row .ic[data-k="ok"]{background:var(--ok-bg);color:var(--ok)} .row .ic[data-k="warn"]{background:var(--warn-bg);color:var(--warn)} .row .ic[data-k="bad"]{background:var(--bad-bg);color:var(--bad)} .row .ic[data-k="info"]{background:var(--info-bg);color:var(--info)} .row .ic[data-k="neu"]{background:var(--neu-bg);color:var(--neu)} .row .ic[data-k="rec"]{background:var(--rec-bg);color:var(--rec)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;line-height:1.4}
.row .tx small{display:block;color:var(--muted);font-size:.8125em;line-height:1.45}
.row .end{color:var(--muted);display:flex;align-items:center;gap:6px;font-size:.875em}
.row.danger{color:var(--bad)}
.row.danger .ic{background:var(--bad-bg);color:var(--bad)}
.row .unread{width:9px;height:9px;border-radius:50%;background:var(--rec);flex:none}
.row.read .tx b{font-weight:500}
.lgroup{font-size:.8125em;font-weight:700;color:var(--ink-2);letter-spacing:.04em;margin:18px 6px 8px}

/* switch */
.sw{width:52px;height:32px;border-radius:16px;background:var(--field);border:0;position:relative;flex:none;transition:background .2s;padding:0;display:inline-block}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .3);transition:inset-inline-start .2s var(--ease)}
.sw[aria-checked="true"],.swrow[aria-checked="true"] .sw{background:var(--ok-fill)}
.sw[aria-checked="true"]::after,.swrow[aria-checked="true"] .sw::after{inset-inline-start:23px}
/* the whole 56 px row is the switch (UX critique 10) */
.row.swrow{cursor:pointer}
.swrow[aria-disabled="true"]{cursor:default}
.swrow[aria-disabled="true"] .sw{opacity:.6}
.segrow{padding:0 14px 12px}

/* segmented control */
.seg{display:flex;padding:4px;border-radius:14px;background:var(--surface-3);gap:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:.875em;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg .n{font-size:.75em;background:var(--warn-bg);color:var(--warn);border-radius:9px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px}
.segwrap{padding:14px 16px 0}

/* filter chips (scrolling) */
.fchips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-weight:600;font-size:.875em;display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed="true"]{background:var(--brand-tint-2);color:var(--ink);border-color:var(--brand)}
.fchip .n{font-size:.8em;opacity:.8}

/* fields */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field>label,.flabel{font-size:.875em;font-weight:600;color:var(--ink-2)}
.input{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--field);background:var(--surface);padding:10px 14px;font-size:max(16px,1em);color:var(--ink);outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint)}
textarea.input{min-height:96px;resize:none;line-height:1.6}
.input[aria-invalid="true"]{border-color:var(--bad)}
.hint{font-size:.8125em;color:var(--muted)}
.err{font-size:.8125em;color:var(--bad);font-weight:600;display:flex;gap:6px;align-items:flex-start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phone{display:flex;align-items:stretch;border:1.5px solid var(--field);border-radius:14px;background:var(--surface);overflow:hidden;direction:ltr}
.phone:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint)}
.phone .cc{display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--surface-3);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.phone input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:1.125em;padding:12px 14px;min-height:56px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.otp{display:flex;gap:8px;justify-content:center;direction:ltr}
.otp input{width:46px;height:58px;border-radius:14px;border:1.5px solid var(--field);background:var(--surface);text-align:center;font:700 1.5em var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink);outline:none;padding:0}
.otp input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint)}
.otp.bad input{border-color:var(--bad);animation:shake .36s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:.9375em;color:var(--ink-2)}
.check input{width:22px;height:22px;accent-color:var(--brand-fill)}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice button{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);font-size:.875em;font-weight:600;color:var(--ink-2)}
.choice button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-ink)}

/* banners */
.banner{margin:12px 16px 0;padding:10px 12px;border-radius:14px;display:flex;gap:10px;align-items:center;font-size:.875em;line-height:1.45;background:var(--neu-bg);color:var(--ink)}
.banner .grow{flex:1;min-width:0}
.banner b{font-weight:700}
.banner[data-k="off"]{background:var(--ink);color:var(--bg)}
.banner[data-k="warn"]{background:var(--warn-bg);color:var(--ink)} .banner[data-k="warn"] .i{color:var(--warn)}
.banner[data-k="bad"]{background:var(--bad-bg);color:var(--ink)} .banner[data-k="bad"] .i{color:var(--bad)}
.banner[data-k="info"]{background:var(--info-bg);color:var(--ink)} .banner[data-k="info"] .i{color:var(--info)}
.banner .btn{min-height:44px;padding:0 12px;font-size:.8125em;border-radius:10px}
/* connection state: a chip in the hero, a strip under the bar (UX critique 5) */
.strip{flex:none;display:flex;align-items:center;gap:10px;padding:6px 16px;min-height:44px;font-size:.8125em;font-weight:600;background:var(--surface-3);color:var(--ink);border-bottom:1px solid var(--line-2);position:relative;z-index:4}
.strip[data-k="bad"]{background:var(--bad-bg)}
.strip[data-k="bad"]>.i{color:var(--bad)}
.strip .grow{flex:1;min-width:0}
.strip .btn{min-height:44px}
.hstate{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:2px 12px;border-radius:999px;background:#fffdf9;color:#2b241e;font-size:.8125em;font-weight:700;border:0;text-align:start}
.hstate[data-k="bad"]{background:#fbe9e7;color:#7a1f1c}
button.hstate{min-height:44px}
.hstate b{text-decoration:underline;text-underline-offset:3px;margin-inline-start:4px}
.lift .banner{margin:12px 0 0}

/* alerts (manager) */
.alert{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:14px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line)}
.alert .sev{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.alert[data-l="0"] .sev{background:var(--bad-bg);color:var(--bad)}
.alert[data-l="1"] .sev{background:var(--warn-bg);color:var(--warn)}
.alert[data-l="2"] .sev{background:var(--info-bg);color:var(--info)}
.alert .a-t{font-weight:700;line-height:1.45;font-size:1em;margin:0}
.alert .a-m{color:var(--ink-2);font-size:.875em;margin-top:2px}
.alert .btns{margin-top:10px;flex-wrap:wrap}
.alert .btns .btn{flex:0 1 auto}
.lvl{font-size:.75em;font-weight:700;letter-spacing:.04em;padding:1px 8px;border-radius:6px;margin-inline-end:6px;vertical-align:2px}
.lvl[data-l="0"]{background:var(--bad-bg);color:var(--bad)} .lvl[data-l="1"]{background:var(--warn-bg);color:var(--warn)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:22px;box-shadow:var(--shadow-2);border:1px solid var(--line);padding:14px 6px}
.stat{text-align:center;padding:4px;min-width:0;border:0;background:none;color:inherit;font:inherit;min-height:56px;cursor:pointer;border-radius:12px}
.stat:active{background:var(--surface-2)}
.stack>.stats{box-shadow:var(--shadow-1)}
.sparkcap{display:flex;justify-content:space-between;font-size:.6875em;color:var(--muted);margin-top:2px;font-weight:600}
.stat+.stat{border-inline-start:1px solid var(--line)}
.stat b{display:block;font:700 1.5em/1.15 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.stat b small{font-size:.55em;color:var(--muted);font-weight:600}
.stat span{display:block;font-size:.75em;color:var(--muted);font-weight:600;line-height:1.3;margin-top:2px}
.stat.bad b{color:var(--bad)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.kpi div{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font:700 1.25em/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:.75em;color:var(--muted);font-weight:600}
.spark{display:block;width:100%;height:28px;margin-top:4px}

/* board (today, manager) */
.brow{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 14px;align-items:start;border:0;background:none;width:100%;text-align:start;color:inherit;position:relative}
.brow .bt{flex:1;min-width:0;font-weight:700;line-height:1.4}
.brow+.brow{border-top:1px solid var(--line)}
.brow .tm{font:700 .9375em/1.2 var(--f-display);font-variant-numeric:tabular-nums;padding-top:2px}
.brow .tm small{display:block;font:500 .75em var(--f-body);color:var(--muted)}
.slots{display:grid;gap:6px;margin-top:8px}
.slotline{display:flex;align-items:center;gap:8px;font-size:.875em;min-width:0}
.slotline .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}

/* week strip */
.week{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.week::-webkit-scrollbar{display:none}
.day{flex:none;width:52px;min-height:76px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0}
.day small{font-size:.75em;color:var(--muted);font-weight:600}
.day b{font:700 1.125em/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.day .mk{display:flex;gap:3px;height:8px;align-items:center}
.day .mk i{width:6px;height:6px;border-radius:50%;background:var(--brand)}
.day .mk i.d{border-radius:1px;background:var(--info);transform:rotate(45deg)}
.day .mk i.l{background:var(--ok)}
.day[aria-pressed="true"]{background:var(--brand-tint-2);border-color:var(--brand);color:var(--ink)}
.day[aria-pressed="true"] small{color:var(--ink-2)}
.day.today b{color:var(--brand-ink)}
.dayh{display:flex;align-items:baseline;gap:8px;margin:18px 4px 8px}
.dayh b{font:700 .9375em var(--f-display)}
.dayh small{color:var(--muted);font-size:.8125em}
.duty{display:flex;align-items:center;gap:12px;padding:12px 14px}
.duty .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--info-bg);color:var(--info);flex:none}

/* roster */
.roster{display:grid;grid-template-columns:auto 1fr 1fr;font-size:.8125em}
.roster>div{padding:9px 10px;border-top:1px solid var(--line);min-width:0}
.roster .rh{font-weight:700;color:var(--muted);font-size:.75em;border-top:0}
.roster .rd b{display:block;font-weight:700}
.roster .rd small{color:var(--muted)}
.gap{color:var(--bad);font-weight:700;display:inline-flex;gap:4px;align-items:center}

/* stars */
.stars{padding:16px}
.stars .top{display:flex;align-items:center;gap:12px}
.medal{width:52px;height:52px;border-radius:16px;background:var(--brand-tint);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.pts{font:700 1.75em/1 var(--f-display);font-variant-numeric:tabular-nums}
.pts small{font-size:.45em;color:var(--muted);font-weight:600;margin-inline-start:4px}
.meter{height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden;margin:14px 0 6px}
.meter i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--brand),var(--brand-fill))}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line)}
.tally div{background:var(--surface);padding:12px 8px;text-align:center}
.tally b{display:block;font:700 1.25em/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.tally span{font-size:.75em;color:var(--muted);font-weight:600}

/* profile */
.prof{display:flex;align-items:center;gap:14px;padding:16px}
.prof .tx{min-width:0}
.prof b{display:block;font:700 1.125em/1.3 var(--f-display)}
.prof small{display:block;color:var(--muted);font-size:.8125em}

/* empty, error, skeleton */
.empty{text-align:center;padding:28px 20px 12px;display:grid;justify-items:center;gap:6px}
.empty .art{width:76px;height:76px;border-radius:24px;background:var(--surface-3);color:var(--ink-2);display:grid;place-items:center;margin-bottom:6px}
.empty b{font:700 1.0625em/1.4 var(--f-display)}
.empty p{margin:0;color:var(--muted);font-size:.875em;max-width:28ch}
.empty .btn{margin-top:10px}
.sk{background:linear-gradient(90deg,var(--surface-3) 0 40%,var(--surface-2) 50%,var(--surface-3) 60% 100%);background-size:300% 100%;animation:sk 1.3s linear infinite;border-radius:8px}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}
[dir="rtl"] .sk{animation-name:skr}
@keyframes skr{from{background-position:0 0}to{background-position:100% 0}}

/* tab bar */
.tabbar{position:absolute;inset-inline:0;bottom:0;height:var(--tabh);padding-bottom:var(--sab);display:flex;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line);z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--muted);font-size:.75em;font-weight:600;min-height:56px;position:relative;padding:0}
.tab .pill{width:58px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background-color .2s}
.tab[aria-current="page"]{color:var(--brand-ink)}
.tab[aria-current="page"] .pill{background:var(--brand-tint-2)}
.tab .bdg{position:absolute;top:4px;inset-inline-start:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--rec);color:var(--on-rec);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--surface)}

/* sticky action bar inside a view */
.actbar{flex:none;padding:12px 16px calc(12px + var(--sab));background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;gap:10px;z-index:4}
.app.tabs .actbar{padding-bottom:12px}
.actbar .btn{flex:1}
.actbar .btn.sq{flex:none}
.fab{position:absolute;inset-inline-end:16px;bottom:16px;z-index:6;min-height:56px;padding:0 20px 0 18px;border-radius:18px;border:0;background:var(--brand-fill);color:var(--on-brand);font-weight:700;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow-2)}

/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .28s;z-index:40}
.scrim.on{opacity:1}
.sheet{position:absolute;inset-inline:0;bottom:var(--kb,0px);max-height:calc(90% - var(--kb,0px));background:var(--surface);border-radius:28px 28px 0 0;z-index:41;transform:translateY(105%);transition:transform .34s var(--ease);display:flex;flex-direction:column;padding-bottom:var(--sab);box-shadow:var(--shadow-2)}
.sheet.on{transform:none}
.grab{width:100%;height:24px;display:grid;place-items:center;flex:none;cursor:grab;touch-action:none}
.grab i{display:block;width:40px;height:5px;border-radius:3px;background:var(--field)}
.discard{position:absolute;inset-inline:0;bottom:0;padding:16px 20px calc(16px + var(--sab));background:var(--surface);border-top:1px solid var(--line-2);box-shadow:0 -8px 24px rgb(0 0 0 / .14);z-index:3;border-radius:20px 20px 0 0}
.discard p{margin:0 0 12px;color:var(--ink-2);font-size:.9375em}
.discard p b{display:block;color:var(--ink);font:700 1.0625em/1.4 var(--f-display)}
.slotc.focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:6px 12px 2px 20px;flex:none}
[dir="ltr"] .sheet-h{padding:6px 12px 2px 20px} [dir="rtl"] .sheet-h{padding:6px 20px 2px 12px}
.sheet-h h3{flex:1;margin:0;font:700 1.125em/1.4 var(--f-display)}
.sheet-h .ibtn{color:var(--muted)}
.sheet-sub{padding:0 20px;color:var(--muted);font-size:.875em;margin:0 0 4px}
.sheet-b{overflow:auto;padding:10px 20px 16px;flex:1}
.sheet-f{padding:12px 20px 14px;display:flex;gap:10px;border-top:1px solid var(--line);flex:none}
.sheet-f .btn{flex:1}
.cand{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);width:100%;text-align:start;color:inherit;min-height:64px}
.cand+.cand{margin-top:8px}
.cand[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint)}
.cand .tx{flex:1;min-width:0}
.cand .tx b{display:block;font-weight:700}
.cand .tx small{display:block;color:var(--muted);font-size:.8125em}
.mapcard{position:relative;height:120px;border-radius:16px;overflow:hidden;background:var(--surface-3);border:1px solid var(--line)}
.mapcard canvas{width:100%;height:100%;display:block}
.mapcard .pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);color:var(--bad);filter:drop-shadow(0 2px 3px rgb(0 0 0 / .3))}
.mapcard .pin .i{width:34px;height:34px;fill:var(--bad);stroke:var(--surface);stroke-width:1.4}
.mapcard .go{position:absolute;inset-inline-end:10px;bottom:10px;min-height:44px;border-radius:12px;padding:0 12px;font-size:.8125em;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:700;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:.9375em;padding:14px}
.kv dt{color:var(--muted);font-size:.875em;font-weight:600;padding-top:1px}
.kv dd{margin:0;min-width:0;color:var(--ink)}
.contact{display:flex;align-items:center;gap:10px;padding:12px 14px}
.contact .tx{flex:1;min-width:0}
.contact .tx b{display:block;font-weight:700}
.contact .tx small{color:var(--muted);font-size:.8125em}
.cbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink);border:0}
.cbtn.wa{background:var(--ok-bg);color:var(--ok)}
.loc{display:grid;justify-items:center;gap:8px;padding:8px 0 4px;text-align:center}
.radar{position:relative;width:132px;height:132px;border-radius:50%;background:var(--info-bg);display:grid;place-items:center;color:var(--info)}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--info);opacity:0;animation:radar 2s ease-out infinite}
.radar::after{animation-delay:1s}
.radar.done::before,.radar.done::after{animation:none}
@keyframes radar{0%{transform:scale(.4);opacity:.6}100%{transform:scale(1.1);opacity:0}}
.acc{font-size:.875em;color:var(--ink-2)}
.acc b{font-variant-numeric:tabular-nums}

/* toast */
.toast{position:absolute;inset-inline:12px;bottom:calc(var(--tabh) + 12px);background:var(--toast);color:var(--on-toast);border-radius:16px;padding:10px 10px 10px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow-2);z-index:60;transform:translateY(14px);opacity:0;transition:opacity .22s,transform .22s var(--ease);font-size:.9375em;line-height:1.45;min-height:52px}
[dir="rtl"] .toast{padding:10px 14px 10px 10px}
.app:not(.tabs) .toast{bottom:calc(var(--sab) + 84px)}
.toast.on{opacity:1;transform:none}
.toast .grow{flex:1;min-width:0}
.toast .ubtn{border:0;background:transparent;color:var(--on-toast);font-weight:700;min-height:44px;padding:0 10px;border-radius:10px;text-decoration:underline;text-underline-offset:3px}

/* push banner: a group with the main button and real action buttons */
.pushb{position:absolute;top:calc(var(--sat) + 4px);inset-inline:8px;z-index:80;border-radius:24px;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 10px 30px -6px rgb(0 0 0 / .35);transform:translateY(-160%);transition:transform .45s var(--ease);color:var(--ink)}
.pushb.on{transform:none}
.pushb .pmain{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;width:100%;padding:12px 14px;border:0;background:none;text-align:start;color:inherit;font:inherit;border-radius:24px}
.device.android .pushb{border-radius:22px;background:var(--surface)}
.device.android .pushb .pmain{grid-template-columns:28px 1fr}
.pushb .ph{display:flex;justify-content:space-between;gap:8px;font-size:.75em;color:var(--muted)}
.pushb .pt{display:block;font-weight:700;font-size:.9375em;line-height:1.4;margin-top:1px}
.pushb .pb{display:block;font-size:.875em;line-height:1.45;color:var(--ink-2)}
.pushb .pa{display:flex;gap:6px;padding:0 14px 12px;padding-inline-start:52px}
.pushb .pa button{min-height:44px;padding:0 14px;border-radius:12px;border:0;font-weight:700;color:var(--ink);background:var(--surface-3);font-size:.875em}

/* system dialog (permission) */
.sysd{position:absolute;inset:0;z-index:85;display:grid;place-items:center;background:rgb(0 0 0 / .32)}
.sysd .box{width:270px;border-radius:16px;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);text-align:center;overflow:hidden;box-shadow:var(--shadow-2)}
.sysd .box p{margin:0;padding:18px 16px 14px;font-size:.875em;color:var(--ink-2)}
.sysd .box p b{display:block;color:var(--ink);font-size:1.0625em;margin-bottom:4px}
.sysd .bb{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line-2)}
.sysd .bb button{min-height:46px;border:0;background:none;color:var(--info);font-size:1em}
.sysd .bb button+button{border-inline-start:1px solid var(--line-2);font-weight:700}
.device.android .sysd .box{width:300px;border-radius:26px;text-align:start;background:var(--surface)}
.device.android .sysd .box p{padding:22px 22px 10px}
.device.android .sysd .bb{display:flex;justify-content:flex-end;gap:4px;border:0;padding:4px 12px 14px}
.device.android .sysd .bb button{border:0;padding:0 14px;border-radius:20px;color:var(--brand-ink);font-weight:700}

/* onboarding */
.onb{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.onb-top{color:var(--on-head);background:var(--head);background-image:linear-gradient(180deg,var(--head),var(--head-2));padding:calc(var(--sat) + 10px) 20px 28px;display:grid;justify-items:center;text-align:center;gap:6px;position:relative}
.onb-top .seal{width:76px;height:76px;padding:6px}
.onb-top h1{margin:8px 0 0;font:700 1.5em/1.3 var(--f-display)}
.onb-top p{margin:0;color:var(--on-head-2);font-size:.875em}
.onb-top .lang{position:absolute;top:calc(var(--sat) + 2px);inset-inline-end:12px;min-height:44px;z-index:1;border-radius:999px;border:1px solid rgb(255 255 255 / .35);background:transparent;color:#fff;font-weight:700;font-size:.8125em;padding:0 12px}
.onb-top .back{position:absolute;top:calc(var(--sat) + 2px);inset-inline-start:6px;color:#fff;z-index:1}
.onb-body{flex:1;overflow:auto;padding:22px 20px 16px;display:flex;flex-direction:column;gap:16px}
.onb-body h2{margin:0;font:700 1.25em/1.35 var(--f-display);text-wrap:balance}
.onb-body p.lede{margin:0;color:var(--ink-2);font-size:.9375em}
.onb-foot{padding:12px 20px calc(16px + var(--sab));display:grid;gap:10px}
.onb.full .onb-top{flex:1;align-content:center;padding-bottom:40px}
.steplist{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steplist li{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);counter-increment:s}
.steplist li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--brand-fill);color:var(--on-brand);display:grid;place-items:center;font:700 .875em var(--f-display)}
.steplist li .k{width:40px;height:40px;border-radius:12px;background:var(--surface-3);display:grid;place-items:center;color:var(--info)}
.steplist li b{display:block;font-weight:700;line-height:1.4}
.steplist li small{display:block;color:var(--muted);font-size:.8125em}
.safari{margin-top:auto;border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-around;align-items:center;color:var(--info);position:relative}
.safari .hl{position:relative}
.safari .hl::after{content:"";position:absolute;inset:-8px;border-radius:12px;border:2px solid var(--info);animation:pulse 1.6s ease-out 3}
.safari.s26{justify-content:space-between;gap:12px}
.safari .addr{flex:1;min-width:0;height:34px;border-radius:17px;background:var(--surface-3);display:grid;place-items:center;font:500 .75em var(--f-mono);color:var(--ink-2);direction:ltr;overflow:hidden}
.pointer{position:absolute;bottom:62px;left:50%;margin-left:-14px;color:var(--info);animation:bob 1.2s ease-in-out 3}
[dir="rtl"] .s26~.pointer,[dir="ltr"] .s26~.pointer{left:auto;inset-inline-end:28px;margin:0}
.tips{margin:0;padding-inline-start:20px;display:grid;gap:8px;color:var(--ink-2);font-size:.9375em}
.otpbox{position:relative;display:grid;grid-template-columns:repeat(6,46px);gap:8px;justify-content:center;direction:ltr}
.otpbox .cell{height:58px;border-radius:14px;border:1.5px solid var(--field);background:var(--surface);display:grid;place-items:center;font:700 1.5em var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.otpbox .cell.cur{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint)}
.otpbox .otp1{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;margin:0;caret-color:transparent;z-index:1;cursor:text}
.otpbox.bad .cell{border-color:var(--bad);animation:shake .36s}
.hint.safe{display:flex;gap:6px;align-items:flex-start;background:var(--surface-3);border-radius:12px;padding:8px 10px;color:var(--ink-2)}
.splash{position:absolute;inset:0;z-index:120;background:var(--icon-bg);display:grid;place-content:center;justify-items:center;gap:10px;color:#fff;text-align:center;transition:opacity .35s}
.splash .seal{width:96px;height:96px;padding:8px}
.splash b{font:700 1.375em var(--f-display)}
.splash small{font-size:.875em}
.splash.out{opacity:0}
@keyframes bob{50%{transform:translateY(6px)}}
.nprev{border-radius:20px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);display:grid;grid-template-columns:40px 1fr;gap:10px}
/* the real app icon: fixed brown square with the cream seal (UX critique 7 and 25) */
.appic{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--icon-bg);flex:none;overflow:hidden}
.appic .aseal{width:80%;height:80%;border-radius:50%;background:#fffdf9;display:grid;place-items:center;padding:2px}
.appic .aseal img{width:100%;height:100%;object-fit:contain;display:block}
.appic.sm{width:28px;height:28px;border-radius:50%}
.appic.lg{width:60px;height:60px;border-radius:14px}
.steplist li .k .appic{width:32px;height:32px;border-radius:8px}
.nprev .pt{font-weight:700;font-size:.9375em}
.nprev .pb{font-size:.875em;color:var(--ink-2)}
.nprev .ph{display:flex;justify-content:space-between;font-size:.75em;color:var(--muted)}
.bullets{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.bullets li{display:flex;gap:12px;align-items:flex-start;font-size:.9375em;color:var(--ink-2)}
.bullets li .i{color:var(--brand-ink);margin-top:2px}
.refuse{display:grid;justify-items:center;text-align:center;gap:10px;padding:10px 4px}
.refuse .art{width:84px;height:84px;border-radius:28px;background:var(--warn-bg);color:var(--warn);display:grid;place-items:center}
.codebox{font:700 1.75em/1 var(--f-mono);letter-spacing:.12em;text-align:center;padding:18px;border-radius:18px;background:var(--surface-3);direction:ltr}

/* mobile: the mockup itself on a phone */
.mfab{display:none}
@media (max-width:1240px){ .stage{grid-template-columns:minmax(270px,320px) auto} .notes{display:none} }
@media (max-width:760px){
  .stage{display:block;padding:0;min-height:0}
  .devcol{display:block}
  .devwrap{transform:none!important;width:100%!important;height:auto!important}
  .device{width:100%;height:100vh;height:100dvh;padding:0;border-radius:0;background:none;box-shadow:none}
  .screen{width:100%;height:100%;border-radius:0;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
  .device.android .screen{border-radius:0;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
  .island,.sbar,.homebar{display:none}
  .demo{position:fixed;inset:auto 0 0 0;top:auto;max-height:78vh;border-radius:24px 24px 0 0;z-index:200;transform:translateY(105%);transition:transform .3s var(--ease);padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-2)}
  .demo.on{transform:none}
  .mfab{display:inline-flex;position:fixed;z-index:199;top:calc(env(safe-area-inset-top,0px) + 10px);left:auto;right:auto;inset-inline-end:62px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid rgb(255 255 255 / .4);background:rgb(0 0 0 / .28);color:#fff;font-size:12px;font-weight:700;align-items:center;gap:6px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .view.in-push,.view.in-pop,.view.out-push,.view.out-pop{animation:none!important}
}
.sheet.closing,.scrim.closing{pointer-events:none}

/* Arabic is never letter-spaced: tracking breaks the joins (UX critique 13); Latin, mono and digits keep it */
:lang(ar) .eyebrow,:lang(ar) .lgroup,:lang(ar) .lvl,:lang(ar) .dg h2,:lang(ar) .notes h3{letter-spacing:0}
/* focus on the brown header: a white ring with a blue halo (UX critique 8) */
.bar :focus-visible,.hero :focus-visible,.minibar :focus-visible,.onb-top :focus-visible{outline:3px solid #fff;outline-offset:1px;box-shadow:0 0 0 6px var(--focus)}
/* high contrast: the «تباين عالٍ» switch and the OS setting (UX critique 9) */
:root[data-contrast="more"]{--line:#948473;--line-2:#948473;--ink:#000000;--ink-2:#2b241e;--muted:#4a3f35;--field:#6f6054}
:root[data-contrast="more"] .app{font-weight:500}
:root[data-contrast="more"][data-theme="dark"]{--line:#8a7a6a;--line-2:#8a7a6a;--ink:#ffffff;--ink-2:#ece4da;--muted:#cbbcab;--field:#a69584}
@media (prefers-color-scheme: dark){:root[data-contrast="more"]:not([data-theme="light"]){--line:#8a7a6a;--line-2:#8a7a6a;--ink:#ffffff;--ink-2:#ece4da;--muted:#cbbcab;--field:#a69584}}
@media (prefers-contrast: more){
  :root:not([data-contrast]){--line:#948473;--line-2:#948473;--ink:#000000;--ink-2:#2b241e;--muted:#4a3f35;--field:#6f6054}
  :root:not([data-contrast]) .app{font-weight:500}
}
@media (prefers-contrast: more) and (prefers-color-scheme: dark){
  :root:not([data-contrast]):not([data-theme="light"]){--line:#8a7a6a;--line-2:#8a7a6a;--ink:#ffffff;--ink-2:#ece4da;--muted:#cbbcab;--field:#a69584}
}

.steps li.skip::before{background:var(--brand)}


/* ================= additions for the three structures (same tokens and components as the 10-07 mockup) ================= */
.stage{padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo .ideal{margin:8px 0 0;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;line-height:1.5}
.demo .ideal b{color:var(--ink)}
.dchips.roles .dchip{flex:1 1 auto;justify-content:center}
.pushk .i{color:var(--brand-ink)}
.pushk:active{background:var(--surface-3)}
.dg .row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* notes: «ما الموجود / ما الناقص» */
.notes .cov{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.notes .cov li{display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.notes .cov li .i{width:16px;height:16px;margin-top:2px}
.notes .cov.has .i{color:var(--ok)}
.notes .cov.miss .i{color:var(--warn)}
.notes .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--brand-tint);color:var(--brand-ink)}
.notes .cur{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:6px}
.notes .cur b{display:block;font-size:13px;color:var(--ink)}
.notes .cur small{display:block;font-size:12px;color:var(--muted)}
.notes .tabs2{display:flex;gap:6px;margin:10px 0 2px}

/* single view, instant: no slide between screens */
.view{will-change:auto}

/* sync chip: «من الذاكرة» then «تم التحديث» */
.syncc{position:absolute;top:calc(var(--sat) + 64px);left:50%;transform:translate(-50%,-6px);z-index:30;display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:2px 12px;border-radius:999px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2);box-shadow:var(--shadow-1);font-size:.75em;font-weight:700;opacity:0;transition:opacity .25s,transform .25s var(--ease);pointer-events:none;white-space:nowrap}
.syncc.on{opacity:1;transform:translate(-50%,0)}
.syncc[data-k="ok"]{color:var(--ok)}
.syncc[data-k="ok"] .i{color:var(--ok)}

/* ---------- A: compact dashboards ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:grid;gap:6px;align-content:start;text-align:start;padding:14px 14px 12px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line);color:inherit;min-height:132px;box-shadow:var(--shadow-1)}
.tile:active{background:var(--surface-2)}
.tile .th{display:flex;align-items:center;gap:8px}
.tile .th .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--brand-tint);color:var(--brand-ink);flex:none}
.tile .th b{font:700 .9375em/1.3 var(--f-display);min-width:0}
.tile .big{font:700 1.75em/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink);display:flex;align-items:baseline;gap:6px;margin-top:4px}
.tile .big small{font:600 .42em/1.3 var(--f-body);color:var(--muted)}
.tile .big.bad{color:var(--bad)} .tile .big.warn{color:var(--warn)} .tile .big.ok{color:var(--ok)}
.tile .ln{font-size:.75em;color:var(--muted);line-height:1.4}
.tile .meter{margin:2px 0 0;height:6px}
.tile .bdg{position:absolute;top:10px;inset-inline-end:10px;min-width:20px;height:20px;border-radius:10px;background:var(--rec);color:var(--on-rec);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.tile.wide{grid-column:1 / -1;min-height:0}
.hubhead{color:var(--on-head);background:var(--head);background-image:linear-gradient(180deg,var(--head),var(--head-2));padding:0 16px 40px;position:relative}
.hubhead::before{content:"";position:absolute;inset-inline:0;bottom:0;height:34px;background:var(--guil) center bottom/520px auto no-repeat;-webkit-mask-image:linear-gradient(to top,#000 55%,transparent);mask-image:linear-gradient(to top,#000 55%,transparent);pointer-events:none}
.hubhead p{margin:0;font-size:.875em;color:var(--on-head-2)}
.tab.mid .pill{width:54px;height:54px;border-radius:18px;background:var(--brand-fill);color:var(--on-brand);margin-top:-26px;box-shadow:var(--shadow-2)}
.tab.mid[aria-current="page"] .pill{background:var(--brand-fill)}
.svcrow .bdg2{min-width:22px;height:22px;border-radius:11px;background:var(--rec);color:var(--on-rec);font-size:.75em;font-weight:700;display:inline-grid;place-items:center;padding:0 6px}

/* ---------- C: launcher + «اليوم» feed ---------- */
.hsearch{display:flex;align-items:center;gap:8px;margin-top:12px;min-height:46px;padding:0 14px;border-radius:14px;background:rgb(255 255 255 / .14);color:var(--on-head);border:1px solid rgb(255 255 255 / .22);width:100%;text-align:start;font-size:.9375em}
.hsearch span{opacity:.9}
.hseg{display:flex;gap:4px;margin-top:12px;padding:4px;border-radius:14px;background:var(--head-chip)}
.hseg button{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--on-head);font-weight:700;font-size:.875em;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.hseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.hseg .n{min-width:18px;height:18px;border-radius:9px;background:var(--rec);color:var(--on-rec);font-size:.75em;display:inline-grid;place-items:center;padding:0 5px}
.hav{width:44px;height:44px;border-radius:50%;border:0;padding:0;background:transparent;display:grid;place-items:center}
.hav .av{box-shadow:0 0 0 2px rgb(255 255 255 / .5)}
.launch{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.lic{display:grid;justify-items:center;gap:6px;border:0;background:none;color:var(--ink);font-size:.75em;font-weight:600;line-height:1.3;text-align:center;padding:4px 0;position:relative;min-height:84px}
.lic .sq{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--brand-ink);box-shadow:var(--shadow-1)}
.lic .sq[data-k="hot"]{background:var(--brand-fill);color:var(--on-brand);border-color:var(--brand-fill)}
.lic .bdg{position:absolute;top:0;inset-inline-end:calc(50% - 36px);min-width:20px;height:20px;border-radius:10px;background:var(--rec);color:var(--on-rec);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--bg)}
.lic:active .sq{transform:scale(.96)}
.feed .fi{padding:14px;display:grid;gap:8px}
.feed .fi .fh{display:flex;align-items:center;gap:8px;font-size:.75em;color:var(--muted);font-weight:700}
.feed .fi .fh .i{color:var(--brand-ink)}
.feed .fi .fh .tm{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.feed .fi h3{margin:0;font-weight:700;font-size:1em;line-height:1.45}
.feed .fi p{margin:0;color:var(--ink-2);font-size:.875em}
.feed .fi .btns{flex-wrap:wrap}
.feed .fi .btns .btn{flex:1 1 auto}
.feed .fi.done{opacity:.7}

/* shared bits */
.bars{display:grid;gap:8px;padding:14px}
.barl{display:grid;grid-template-columns:minmax(0,7.5em) 1fr 2.4em;gap:10px;align-items:center;font-size:.8125em;border:0;background:none;color:inherit;padding:0;text-align:start;min-height:28px}
.barl .tr{height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.barl .tr i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.barl b{font-variant-numeric:tabular-nums;text-align:end}
.barl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.colchart{display:flex;align-items:flex-end;gap:10px;height:120px;padding:14px 14px 0}
.colchart .c{flex:1;display:grid;justify-items:center;gap:4px;align-content:end;height:100%}
.colchart .c i{display:block;width:100%;max-width:30px;border-radius:8px 8px 3px 3px;background:var(--brand-tint-2)}
.colchart .c.cur i{background:var(--brand)}
.colchart .c small{font-size:.6875em;color:var(--muted)}
.colchart .c b{font-size:.75em;font-variant-numeric:tabular-nums}
.avgrid{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,26px);gap:6px 4px;align-items:center;padding:12px 14px;font-size:.8125em}
.avgrid .h{font-size:.6875em;color:var(--muted);text-align:center;font-weight:700}
.avgrid .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avgrid .d{width:22px;height:22px;border-radius:7px;justify-self:center;background:var(--ok-bg);border:1px solid var(--line)}
.avgrid .d[data-k="busy"]{background:var(--info-bg)} .avgrid .d[data-k="off"]{background:var(--bad-bg)} .avgrid .d[data-k="duty"]{background:var(--brand-tint-2);border-color:var(--brand)}
.qr{width:96px;height:96px;border-radius:12px;background:#fff;padding:6px;flex:none}
.prog{padding:14px;display:grid;gap:8px}
.prog .ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.accs{display:flex;gap:6px;flex-wrap:wrap}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.dcell{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px;text-align:center;font-size:.75em;color:var(--ink-2);min-height:52px;display:grid;align-content:center;gap:1px}
.dcell b{font:700 1.15em/1.1 var(--f-display);color:var(--ink)}
.dcell[data-k="done"]{background:var(--ok-bg)} .dcell[data-k="today"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)} .dcell[data-k="cx"]{background:var(--surface-3);text-decoration:line-through} .dcell[data-k="chg"]{background:var(--warn-bg)}
.loglist{list-style:none;margin:0;padding:0}
.loglist li{display:grid;grid-template-columns:16px 1fr;gap:8px;padding:8px 14px;font-size:.8125em;color:var(--ink-2)}
.loglist li+li{border-top:1px solid var(--line)}
.loglist li .i{color:var(--muted);margin-top:3px}
.starsel{display:flex;gap:6px;justify-content:center;direction:ltr}
.starsel button{width:48px;height:48px;border:0;background:none;color:var(--line-2);display:grid;place-items:center}
.starsel button[aria-pressed="true"]{color:var(--warn)}
.starsel .i{width:34px;height:34px}
.starsel button[aria-pressed="true"] .i{fill:currentColor}
.sel{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-size:6px 6px;background-repeat:no-repeat;background-position:left 18px center,left 12px center}
[dir="ltr"] .sel{background-position:right 12px center,right 18px center}
.gate{display:grid;gap:10px}
.gate .card{padding:12px 14px}
.cnum{font:700 1.25em/1 var(--f-display);font-variant-numeric:tabular-nums}
.mt0{margin-top:0}
.pd{padding:14px}
.minirow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.scroll .pad-b{height:96px}
.app:not(.tabs) .scroll .pad-b{height:40px}
.app.hasfab .scroll .pad-b{height:110px}
.app.hasfab .toast{bottom:calc(var(--sab) + 92px)}
.view .fab{bottom:16px}
.app:not(.tabs) .view .fab{bottom:calc(16px + var(--sab))}
.app.hasfab.tabs .toast{bottom:calc(var(--tabh) + 84px)}
.roster .rb{border:0;background:none;text-align:start;color:inherit;font:inherit;padding:9px 10px;border-top:1px solid var(--line);min-width:0;cursor:pointer}
.roster .rb:active{background:var(--surface-2)}
.roster .rb b{display:block;font-weight:700}
.roster .rb small{color:var(--muted)}
.roster .me{background:var(--brand-tint)}
.stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}
.cbtn[disabled]{opacity:.35}
.row .end .cbtn{width:40px;height:40px;border-radius:12px}
.obx{text-align:start;color:inherit;font:inherit}
.obx .tx b{color:var(--ink)}
.btn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-ink)}
.hero .hav .av{width:36px;height:36px}
/* notes stay readable at every width (the mockup hid them under 1240px) */
@media (max-width:1240px){ .stage{grid-template-columns:minmax(270px,320px) auto} .notes{display:block;grid-column:1 / -1;position:static;max-height:none} }
@media (max-width:760px){
  .stage{display:block;padding-block:0 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .devcol{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}

}
bdi.mono{white-space:nowrap}
@media (max-width:760px){
  .mfab{top:46%;bottom:auto;inset-inline-end:-8px;width:40px;min-height:44px;padding:0 0 0 0;justify-content:center;font-size:16px;border-radius:12px;opacity:.92;background:var(--brand-fill);color:var(--on-brand);border:0;box-shadow:var(--shadow-2)}
}
.story{border:1px solid var(--line-2);background:var(--surface);border-radius:16px;padding:10px 12px;display:grid;gap:6px;margin:10px 0 4px}
.story .sth{display:flex;align-items:center;gap:6px}
.story .sth b{font-size:13.5px;color:var(--ink);flex:1;min-width:0}
.story .tag{font-size:11px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft,rgb(0 0 0 / .05));border-radius:999px;padding:2px 8px;white-space:nowrap}
.story p{margin:0;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.story p.ok{color:var(--ok)}
.story .stb{display:flex;align-items:center;gap:6px}
.story .stb .grow{flex:1}

.mbar{display:none}

  .mbar{display:block;position:sticky;top:0;z-index:150;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
  .mbar .mrow{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .mbar .mrow::-webkit-scrollbar{display:none}

  .mbar .mlab{font-size:11px;font-weight:700;color:var(--muted);flex:none;min-width:42px}

  .device{height:calc(100dvh - var(--mbh,96px))!important}

}

/* ---------- modules 11-04: maps, structure, requests, courses, press, lock ---------- */
.gmap{display:block;width:100%;height:auto;border-radius:var(--r-m)}
.card>.gmap{border-radius:calc(var(--r-l) - 1px) calc(var(--r-l) - 1px) 0 0}
.mapbtn{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden;text-align:start;color:inherit;font:inherit;box-shadow:var(--shadow-1)}
.mapbtn .gmap{border-radius:0}
.mapbtn .legend{padding:10px 14px 12px;margin:0}
.legend>span{display:inline-flex;align-items:center;gap:5px;font-size:.75em;font-weight:600;color:var(--ink-2);margin-inline-end:6px}

.mk{cursor:pointer}

.near b{display:block;font-weight:700}
.near small{display:block;color:var(--ink-2);font-size:.8125em;margin-top:2px;line-height:1.45}
.autohint{margin:8px 2px 0;font-size:.75em;color:var(--muted);display:flex;gap:6px;align-items:center;line-height:1.4}
.autohint .i{color:var(--info);flex:none}
.loglist.trk li .i{color:var(--info)}
.seg.scroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg.scroll::-webkit-scrollbar{display:none}
.seg.scroll button{flex:1 0 auto;padding:0 8px}
.btns.wrap{flex-wrap:wrap}
.btns.wrap>.btn{flex:1 1 auto}
.dh{font:700 1.25em/1.4 var(--f-display);margin:10px 0 12px;color:var(--ink)}
.mini{display:block;width:56px}
.mini .meter{margin:0}
.pprev{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;padding:12px 14px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);color:var(--ink);font:inherit}
.pprev b{display:block;font-weight:700;font-size:.9375em}
.pprev>span>span{display:block;font-size:.875em;color:var(--ink-2);line-height:1.45;margin-top:2px}
.news p{line-height:2;margin:0}

.lockv .hint{margin:0}
